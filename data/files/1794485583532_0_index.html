<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Belajar Python</title>
<style>
:root{--bg:#f3f6f1;--sf:#fff;--tx:#17231c;--mu:#5d6b62;--ac:#1f6f4a;--ac2:#e9f3ed;--bd:#d5ded7;--er:#b3261e;--cb:#14201a;--ct:#d8eadf}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1713;--sf:#17221c;--tx:#e6efe9;--mu:#98a89e;--ac:#4cc38a;--ac2:#1d2e25;--bd:#2a3a31;--er:#ff8a80;--cb:#0a110d;--ct:#d8eadf}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.6 Georgia,"Times New Roman",serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
h1,h2,h3,button,input,label,.sans{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 40px}
.brand{font:700 22px system-ui,sans-serif;margin:8px 0 18px}
.brand span{color:var(--ac)}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:18px;margin-bottom:16px}
.tabs{display:flex;gap:6px;margin-bottom:16px}
.tabs button{flex:1;padding:10px;border:1px solid var(--bd);background:var(--sf);color:var(--tx);border-radius:8px;font-weight:600;cursor:pointer}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
label{display:block;font-size:14px;font-weight:600;margin:12px 0 4px}
input{width:100%;padding:11px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font-size:16px}
input:focus,button:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.btn{width:100%;margin-top:16px;padding:12px;border:0;border-radius:8px;background:var(--ac);color:#fff;font-size:16px;font-weight:700;cursor:pointer}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ac);border:1px solid var(--ac);margin-top:10px}
.msg{margin-top:12px;font:14px system-ui,sans-serif;min-height:1.2em}
.msg.err{color:var(--er)}.msg.ok{color:var(--ac)}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.top button{background:none;border:1px solid var(--bd);color:var(--tx);padding:6px 12px;border-radius:8px;cursor:pointer}
.prof{display:flex;gap:14px;align-items:center}
.av{width:52px;height:52px;border-radius:50%;background:var(--ac);color:#fff;display:grid;place-items:center;font:700 22px system-ui,sans-serif;flex:none}
.prof p{margin:0;font:14px system-ui,sans-serif;color:var(--mu)}
.prof b{font-size:18px;color:var(--tx)}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;font:600 12px system-ui,sans-serif;margin-top:4px}
.badge.v{background:var(--ac2);color:var(--ac)}.badge.n{background:#fdecea;color:#b3261e}
.otp{text-align:center}
.otp input{text-align:center;letter-spacing:.4em;font-size:22px}
.bar{height:8px;background:var(--ac2);border-radius:99px;overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;background:var(--ac);width:0;transition:width .3s}
.chs{list-style:none;margin:0;padding:0}
.chs li{display:flex;gap:12px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--bd);cursor:pointer;font-family:system-ui,sans-serif}
.chs li:last-child{border:0}
.chs .n{width:32px;height:32px;border-radius:8px;background:var(--ac2);color:var(--ac);display:grid;place-items:center;font-weight:700;flex:none}
.chs li.done .n{background:var(--ac);color:#fff}
.chs .t{flex:1}
pre{background:var(--cb);color:var(--ct);padding:14px;border-radius:8px;overflow-x:auto;font:14px/1.5 ui-monospace,Menlo,Consolas,monospace;margin:14px 0}
.nav{display:flex;gap:8px;margin-top:14px}
.nav .btn{margin-top:0}
.hide{display:none!important}
.mu{color:var(--mu);font:14px system-ui,sans-serif}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">Belajar <span>Python</span></div>

  <!-- AUTH -->
  <p id="load" class="mu">Memuat...</p>
  <section id="auth" class="hide">
    <div class="tabs">
      <button id="tLogin" class="on">Masuk</button>
      <button id="tReg">Daftar</button>
    </div>
    <div class="card">
      <form id="fLogin" autocomplete="on">
        <label for="lu">Username</label><input id="lu" autocomplete="username" required>
        <label for="lp">Password</label><input id="lp" type="password" autocomplete="current-password" required>
        <button class="btn" type="submit">Masuk</button>
      </form>
      <form id="fReg" class="hide" autocomplete="on">
        <label for="ru">Username</label><input id="ru" autocomplete="username" pattern="[A-Za-z0-9_]{3,20}" title="3–20 karakter: huruf, angka, garis bawah" required>
        <label for="rw">Nomor WhatsApp</label><input id="rw" type="tel" inputmode="numeric" placeholder="08123456789" autocomplete="tel" required>
        <label for="rp">Password</label><input id="rp" type="password" minlength="6" autocomplete="new-password" required>
        <button class="btn" type="submit">Buat akun</button>
      </form>
      <div id="authMsg" class="msg" role="alert"></div>
    </div>
  </section>

  <!-- DASHBOARD -->
  <section id="dash" class="hide">
    <div class="top"><span class="mu">Dashboard</span><button id="out">Keluar</button></div>
    <div class="card prof">
      <div class="av" id="av"></div>
      <div><b id="pu"></b><p id="pw"></p><span id="pb" class="badge"></span></div>
    </div>

    <!-- Gerbang OTP -->
    <div id="gate" class="card otp hide">
      <h2 style="margin:0 0 4px;font-size:20px">Verifikasi WhatsApp</h2>
      <p class="mu" style="margin:0 0 6px">Kamu harus verifikasi OTP dulu sebelum bisa belajar. Kode dikirim ke <b id="gw"></b>.</p>
      <button id="send" class="btn ghost">Kirim kode OTP</button>
      <div id="otpBox" class="hide">
        <label for="code" style="text-align:left">Masukkan kode OTP</label>
        <input id="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="------" autocomplete="one-time-code">
        <button id="ver" class="btn">Verifikasi</button>
      </div>
      <div id="otpMsg" class="msg" role="alert"></div>
    </div>

    <!-- Materi -->
    <div id="course" class="hide">
      <div class="card">
        <div class="top" style="margin:0"><b class="sans">Progres belajar</b><span id="pct" class="mu"></span></div>
        <div class="bar"><i id="barI"></i></div>
      </div>
      <div id="list" class="card"><ul class="chs" id="chs"></ul></div>
      <div id="chap" class="card hide">
        <button id="back" class="sans" style="background:none;border:0;color:var(--ac);cursor:pointer;padding:0;font-weight:600">&larr; Daftar bab</button>
        <h2 id="ct" style="margin:10px 0 0;font-size:22px"></h2>
        <div id="cb"></div>
        <pre id="cc"></pre>
        <button id="done" class="btn"></button>
        <div class="nav"><button id="prev" class="btn ghost">Sebelumnya</button><button id="next" class="btn ghost">Berikutnya</button></div>
      </div>
    </div>
  </section>
</div>

<script>
// ===== SUPABASE =====
const SB = "https://dbbfoisrphocoyddgyhu.supabase.co";
const KEY = "sb_publishable_PmYc-4IAfiNVPhvrH0fnvw_OBuK28Gd";
const H = { "apikey": KEY, "Content-Type": "application/json" };

const $ = id => document.getElementById(id);
const say = (el, t, type) => { el.textContent = t; el.className = "msg " + (type || ""); };
const tok = {
  get(){ try{ return localStorage.getItem("py_token"); }catch(e){ return null; } },
  set(v){ try{ v ? localStorage.setItem("py_token", v) : localStorage.removeItem("py_token"); }catch(e){} }
};

async function rpc(fn, args){
  const r = await fetch(SB + "/rest/v1/rpc/" + fn, { method:"POST", headers:H, body:JSON.stringify(args) });
  if(!r.ok) throw new Error("Koneksi ke server gagal (" + r.status + ")");
  const t = await r.text();
  return t ? JSON.parse(t) : null;
}
async function otpCall(action, code){
  const r = await fetch(SB + "/functions/v1/py-otp", { method:"POST", headers:H, body:JSON.stringify({ action, token, code }) });
  let d = {}; try{ d = await r.json(); }catch(e){}
  if(!r.ok || d.error) throw new Error(d.error || "Permintaan gagal (" + r.status + ")");
  return d;
}
function normPhone(p){
  p = p.replace(/[^0-9]/g, "");
  if(p.startsWith("0")) p = "62" + p.slice(1);
  else if(p.startsWith("8")) p = "62" + p;
  return p;
}

let token = tok.get(), me = null, CH = [], cur = 0;

// ===== AUTH =====
function tab(reg){
  $("tLogin").classList.toggle("on", !reg); $("tReg").classList.toggle("on", reg);
  $("fLogin").classList.toggle("hide", reg); $("fReg").classList.toggle("hide", !reg);
  say($("authMsg"), "");
}
$("tLogin").onclick = () => tab(false);
$("tReg").onclick = () => tab(true);

async function authSubmit(e, fn, args){
  e.preventDefault();
  const b = e.target.querySelector("button"); b.disabled = true; say($("authMsg"), "Memproses...");
  try{
    const r = await fn(args());
    if(r.error) say($("authMsg"), r.error, "err");
    else { token = r.token; tok.set(token); await boot(); }
  }catch(err){ say($("authMsg"), err.message, "err"); }
  b.disabled = false;
}
$("fReg").onsubmit = e => authSubmit(e, a => rpc("py_register", a), () => ({
  p_username: $("ru").value, p_phone: normPhone($("rw").value), p_password: $("rp").value }));
$("fLogin").onsubmit = e => authSubmit(e, a => rpc("py_login", a), () => ({
  p_username: $("lu").value, p_password: $("lp").value }));

$("out").onclick = async () => {
  try{ await rpc("py_logout", { p_token: token }); }catch(e){}
  token = null; me = null; tok.set(null); CH = []; show();
};

// ===== OTP =====
let cd = 0, timer;
function cooldown(){
  clearInterval(timer);
  timer = setInterval(() => {
    cd--; const b = $("send");
    if(cd <= 0){ clearInterval(timer); b.disabled = false; b.textContent = "Kirim ulang OTP"; }
    else b.textContent = "Kirim ulang dalam " + cd + " dtk";
  }, 1000);
}
$("send").onclick = async () => {
  const b = $("send"); b.disabled = true; say($("otpMsg"), "Mengirim kode...");
  try{
    await otpCall("send");
    say($("otpMsg"), "Kode OTP dikirim ke WhatsApp kamu. Berlaku 5 menit.", "ok");
    $("otpBox").classList.remove("hide"); $("code").focus();
    cd = 60; cooldown();
  }catch(err){
    b.disabled = false; say($("otpMsg"), "Gagal mengirim OTP: " + err.message, "err");
  }
};
$("ver").onclick = async () => {
  const code = $("code").value.trim();
  if(!/^[0-9]{6}$/.test(code)) return say($("otpMsg"), "Masukkan 6 digit kode OTP.", "err");
  const b = $("ver"); b.disabled = true; say($("otpMsg"), "Memeriksa kode...");
  try{ await otpCall("verify", code); await boot(); }
  catch(err){ say($("otpMsg"), err.message, "err"); $("code").value = ""; $("code").focus(); }
  b.disabled = false;
};

// ===== MATERI =====
function drawList(){
  const ul = $("chs"); ul.innerHTML = "";
  CH.forEach((c, i) => {
    const d = me.done.includes(c.n), li = document.createElement("li");
    if(d) li.className = "done";
    li.innerHTML = '<span class="n"></span><span class="t"></span>';
    li.children[0].textContent = d ? "\u2713" : c.n;
    li.children[1].textContent = c.title;
    li.onclick = () => open(i);
    ul.appendChild(li);
  });
  $("pct").textContent = me.done.length + " dari " + CH.length + " bab";
  $("barI").style.width = Math.round(me.done.length / CH.length * 100) + "%";
}
function open(i){
  cur = i; const c = CH[i], d = me.done.includes(c.n);
  $("ct").textContent = "Bab " + c.n + ": " + c.title;
  $("cb").textContent = c.body; $("cc").textContent = c.code;
  $("done").textContent = d ? "Tandai belum selesai" : "Tandai selesai";
  $("prev").disabled = i === 0; $("next").disabled = i === CH.length - 1;
  $("list").classList.add("hide"); $("chap").classList.remove("hide");
  window.scrollTo(0, 0);
}
$("back").onclick = () => { $("chap").classList.add("hide"); $("list").classList.remove("hide"); drawList(); };
$("done").onclick = async () => {
  $("done").disabled = true;
  try{
    const r = await rpc("py_toggle", { p_token: token, p_chapter: CH[cur].n });
    if(r.error) return boot();
    me.done = r.done; open(cur);
  }catch(e){}
  $("done").disabled = false;
};
$("prev").onclick = () => open(cur - 1);
$("next").onclick = () => open(cur + 1);

// ===== RENDER =====
async function boot(){
  if(!token){ me = null; return show(); }
  try{
    const m = await rpc("py_me", { p_token: token });
    if(m.error){ token = null; tok.set(null); me = null; return show(); }
    me = m; CH = [];
    if(me.verified){
      const c = await rpc("py_chapters", { p_token: token });
      if(c.chapters) CH = c.chapters; else me.verified = false;
    }
  }catch(err){
    $("load").textContent = err.message; return;
  }
  show();
}
function show(){
  $("load").classList.add("hide");
  if(!me){ $("auth").classList.remove("hide"); $("dash").classList.add("hide"); return; }
  $("auth").classList.add("hide"); $("dash").classList.remove("hide");
  $("av").textContent = me.username[0].toUpperCase();
  $("pu").textContent = me.username;
  $("pw").textContent = "WhatsApp: +" + me.phone;
  $("pb").textContent = me.verified ? "Terverifikasi" : "Belum verifikasi";
  $("pb").className = "badge " + (me.verified ? "v" : "n");
  $("gw").textContent = "+" + me.phone;
  $("gate").classList.toggle("hide", me.verified);
  $("course").classList.toggle("hide", !me.verified);
  if(me.verified){ $("chap").classList.add("hide"); $("list").classList.remove("hide"); drawList(); }
}
boot();
</script>
</body>
</html>
